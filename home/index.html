<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>QREN Esports — Tournaments</title>
<script>
try {
    var savedTheme = localStorage.getItem("theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
    else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
    var savedAccent = localStorage.getItem("accent");
    if (savedAccent) document.documentElement.setAttribute("data-accent", savedAccent);
} catch (e) {}
</script>
<link rel="stylesheet" href="../assets/ui.css" />
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="../home/">
            <span class="brand-mark">
                <img src="../PROJECT%20LOGO/qren-logo.png" alt="QREN Esports logo" />
            </span>
            <span>
                <strong class="brand-name" data-tournament-name>QREN Esports</strong>
                <span class="brand-sub">Player area</span>
            </span>
        </a>
    </div>
</header>

<main class="shell">
    <div class="app-head">
        <div>
            <h1>Tournaments</h1>
            <p id="homeSub">Available matches load ho rahe hain...</p>
        </div>
    </div>

    <div id="tournamentList" class="t-list">
        <div class="skel-card">
            <div class="skeleton skel-line w60"></div>
            <div class="skeleton skel-line w40"></div>
            <div class="skeleton skel-line w85" style="margin-top:16px"></div>
        </div>
        <div class="skel-card">
            <div class="skeleton skel-line w60"></div>
            <div class="skeleton skel-line w40"></div>
            <div class="skeleton skel-line w85" style="margin-top:16px"></div>
        </div>
    </div>

    <div class="empty" id="emptyState" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M7 5H4v2a4 4 0 0 0 4 4"/><path d="M17 5h3v2a4 4 0 0 1-4 4"/></svg>
        <h3>Abhi koi tournament nahi hai</h3>
        <p>Admin jab naya tournament add karega, wo yahan turant dikhega.</p>
    </div>

    <div class="alert danger" id="errorBox" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div>
            <strong>Tournaments load nahi ho paye</strong>
            <p class="muted" style="font-size:.78rem" id="errorText">Internet check karke dobara try karo.</p>
            <button class="btn outline sm" type="button" style="margin-top:8px" onclick="loadTournaments()">Retry</button>
        </div>
    </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../assets/app.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/app-nav.js"></script>
<script>
    "use strict";

    var pageUser = null;
    var pageProfile = null;
    var loading = false;

    function $(id) { return document.getElementById(id); }

    function gameIcon() {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h4M8 9v4"/><path d="M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.9 3.1l-1.2 6A3 3 0 0 0 7.4 17l1.2-2h6.8l1.2 2a3 3 0 0 0 5.8-2.9l-1.2-6A4 4 0 0 0 17.3 5z"/></svg>';
    }

    function effectiveStatus(t) {
        if (CA_PAGE.remainingSlots(t) <= 0 && String(t.status || "").toLowerCase() !== "completed" && String(t.status || "").toLowerCase() !== "cancelled") {
            return "full";
        }
        return t.status || "open";
    }

    function cardHtml(t) {
        var status = CA_PAGE.statusInfo(effectiveStatus(t));
        var total = CA_PAGE.number(t.totalSlots);
        var joined = CA_PAGE.number(t.joinedCount);
        var remaining = CA_PAGE.remainingSlots(t);
        var pct = total > 0 ? Math.min(Math.round((joined / total) * 100), 100) : 0;

        var imageUrl = CA.safeHttpUrl(t.imageUrl);
        var cover = imageUrl
            ? '<span class="t-cover"><img src="' + CA.esc(imageUrl) + '" alt="" loading="lazy" decoding="async" onerror="this.style.display=\'none\'" /></span>'
            : "";

        return '<a class="t-card' + (cover ? " has-cover" : "") + '" href="../tournament/?id=' + encodeURIComponent(t.id) + '">' +
            cover +
            '<div class="t-body">' +
                '<div class="t-head">' +
                    '<div>' +
                        '<div class="t-name">' + CA.esc(t.name || "Untitled tournament") + '</div>' +
                        '<div class="t-game">' + gameIcon() + CA.esc(t.game || "Game") + '</div>' +
                    '</div>' +
                    '<span class="badge ' + status.cls + '"><span class="dot"></span>' + CA.esc(status.label) + '</span>' +
                '</div>' +
                '<div class="t-meta">' +
                    '<div class="hm"><span class="hm-lb">Entry fee</span><strong class="hm-val">' + CA.esc(CA_PAGE.money(t.entryFee)) + '</strong></div>' +
                    '<div class="hm"><span class="hm-lb">Prize pool</span><strong class="hm-val">' + CA.esc(CA_PAGE.money(t.prizePool)) + '</strong></div>' +
                    '<div class="hm"><span class="hm-lb">Match time</span><strong class="hm-val">' + CA.esc(CA.fmtTime(t.matchDate) || "TBA") + '</strong></div>' +
                    '<div class="hm"><span class="hm-lb">Slots left</span><strong class="hm-val">' + remaining + ' / ' + total + '</strong></div>' +
                '</div>' +
                '<div class="slot-bar"><span class="' + (remaining <= 0 ? "full" : "") + '" style="width:' + pct + '%"></span></div>' +
                '<div class="t-foot">' +
                    '<span class="t-slots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' + joined + ' joined</span>' +
                    '<span class="t-go">Details <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>' +
                '</div>' +
            '</div>' +
        '</a>';
    }

    function sortTournaments(list) {
        var order = { open: 0, upcoming: 1, ongoing: 2, full: 3, closed: 4, completed: 5, cancelled: 6 };
        return list.sort(function (a, b) {
            var sa = effectiveStatus(a), sb = effectiveStatus(b);
            var oa = order[String(sa).toLowerCase()];
            var ob = order[String(sb).toLowerCase()];
            if (oa == null) oa = 9;
            if (ob == null) ob = 9;
            if (oa !== ob) return oa - ob;
            return CA_PAGE.number(a.matchDate && a.matchDate.toMillis ? a.matchDate.toMillis() : 0) -
                   CA_PAGE.number(b.matchDate && b.matchDate.toMillis ? b.matchDate.toMillis() : 0);
        });
    }

    async function loadTournaments() {
        if (loading) return;
        loading = true;
        $("errorBox").style.display = "none";

        try {
            var snap = await db.collection("tournaments").get();
            var list = [];
            snap.forEach(function (doc) {
                var t = doc.data();
                t.id = doc.id;
                list.push(t);
            });

            sortTournaments(list);
            $("tournamentList").innerHTML = list.map(cardHtml).join("");
            $("emptyState").style.display = list.length ? "none" : "block";
            $("homeSub").textContent = list.length ? "Apna match chuno aur Join Tournament dabao." : "Abhi koi match available nahi hai.";
        } catch (err) {
            console.error(err);
            $("tournamentList").innerHTML = "";
            $("emptyState").style.display = "none";
            $("errorText").textContent = "Internet ya Firestore permissions check karo.";
            $("errorBox").style.display = "flex";
        } finally {
            loading = false;
        }
    }

    (async function init() {
        try {
            var boot = await CA_PAGE.boot("home");
            pageUser = boot.user;
            pageProfile = boot.profile;
            if (pageProfile && pageProfile.userName) {
                $("homeSub").textContent = "Hi " + pageProfile.userName + ", apna match chuno.";
            }
            await loadTournaments();
        } catch (err) {
            console.error(err);
            $("errorText").textContent = "Page load nahi ho paya. Reload karo.";
            $("errorBox").style.display = "flex";
        }
    })();
</script>
</body>
</html>
