<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QREN Admin</title>
<script>
(async function () {
    var base = "/CLASH-AREN-/";
    try {
        var keys = await caches.keys();
        if (keys.indexOf("qren-admin-v11") !== -1) {
            await Promise.all(keys.filter(function (key) {
                return key.indexOf("qren-admin-") === 0;
            }).map(function (key) {
                return caches.delete(key);
            }));
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.filter(function (registration) {
                return registration.scope.indexOf(base + "admin") === 0;
            }).map(function (registration) {
                return registration.unregister();
            }));
        }
    } catch (e) { }
    try {
        sessionStorage.setItem("__spa_redirect", "/admin");
    } catch (e) { }
    location.replace(base);
})();
</script>
</head>
<body></body>
</html>
