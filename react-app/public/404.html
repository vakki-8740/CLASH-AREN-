<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QREN Esports</title>
<script>
(function () {
    var marker = "/CLASH-AREN-";
    var path = location.pathname;
    var base = (path === marker || path.indexOf(marker + "/") === 0) ? marker : "";
    if (base && path.indexOf(base) === 0) path = path.slice(base.length);
    path = path.replace(/\/index\.html$/, "/");
    if (!path) path = "/";
    sessionStorage.setItem("__spa_redirect", path + location.search + location.hash);
    location.replace((base || "") + "/");
})();
</script>
</head>
<body></body>
</html>
