<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tournament Rules</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #E3F2FD 0%, #F2F2F7 30%, #F2F2F7 100%);
            min-height: 100vh;
            color: #1C1C1E;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 40px;
        }

        /* Sky glow orbs */
        body::before {
            content: '';
            position: fixed;
            top: -100px;
            right: -80px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(10,132,255,0.10) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 12px;
        }
        .header-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #0A84FF, #5AC8FA);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(10,132,255,0.25);
            animation: popIn 0.5s cubic-bezier(0.32, 0.72, 0, 1) both;
        }
        .header-icon svg {
            width: 28px;
            height: 28px;
            color: white;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 4px;
            animation: fadeUp 0.5s 0.1s both;
        }
        .header p {
            font-size: 14px;
            color: #8E8E93;
            animation: fadeUp 0.5s 0.15s both;
        }

        /* Rule Card */
        .rule-card {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06), 0 0 20px rgba(10,132,255,0.04);
            opacity: 0;
            animation: slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1) forwards;
            transition: transform 0.2s ease;
        }
        .rule-card:active {
            transform: scale(0.98);
        }

        /* Stagger delays */
        .rule-card:nth-child(1) { animation-delay: 0.15s; }
        .rule-card:nth-child(2) { animation-delay: 0.22s; }
        .rule-card:nth-child(3) { animation-delay: 0.29s; }
        .rule-card:nth-child(4) { animation-delay: 0.36s; }
        .rule-card:nth-child(5) { animation-delay: 0.43s; }
        .rule-card:nth-child(6) { animation-delay: 0.50s; }
        .rule-card:nth-child(7) { animation-delay: 0.57s; }
        .rule-card:nth-child(8) { animation-delay: 0.64s; }
        .rule-card:nth-child(9) { animation-delay: 0.71s; }
        .rule-card:nth-child(10) { animation-delay: 0.78s; }

        .rule-num {
            width: 30px;
            height: 30px;
            min-width: 30px;
            background: linear-gradient(135deg, #0A84FF, #5AC8FA);
            color: white;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            margin-top: 2px;
        }
        .rule-text h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 3px;
            line-height: 1.3;
        }
        .rule-text p {
            font-size: 13px;
            color: #8E8E93;
            margin: 0;
            line-height: 1.4;
        }
        .rule-icon {
            width: 20px;
            height: 20px;
            color: #0A84FF;
            opacity: 0.4;
            flex-shrink: 0;
            margin-top: 4px;
        }

        /* Animations */
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .setup-warning {
            background: rgba(255, 59, 48, 0.07);
            border: 1px solid rgba(255, 59, 48, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #C0392B;
            font-weight: 500;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
            </div>
            <h1>Tournament Rules</h1>
            <p>Please read all rules before joining</p>
        </div>

        <div class="setup-warning" id="setupWarning" style="display:none">Firebase not configured. Add your config in firebase-config.js</div>

        <div id="rulesList"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCXSv7eNl7KcttNvKF46BCAkhYv6t6S0bI",
    authDomain: "user-manage-bot.firebaseapp.com",
    databaseURL: "https://user-manage-bot-default-rtdb.firebaseio.com",
    projectId: "user-manage-bot",
    storageBucket: "user-manage-bot.firebasestorage.app",
    messagingSenderId: "17364199534",
    appId: "1:17364199534:web:dce4f0df3efe163930de7f"
};

const FIREBASE_CONFIGURED = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

let firebaseApp = null;
let db = null;

if (FIREBASE_CONFIGURED && typeof firebase !== 'undefined') {
    firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
}

const DEFAULT_SETTINGS = {
    tournamentName: 'Clash Arena',
    entryFee: 199,
    upiId: '',
    upiName: 'Clash Arena',
    prizePool: '₹5,000',
    matchTime: '9:00 PM',
    maxPlayers: 100,
    announcement: '',
    adminPass: 'admin123',
    rules: [
        { title: 'Fair Play Only', description: 'Any use of hacks, mods, or third-party tools will result in immediate disqualification.' },
        { title: 'Entry Fee Non-Refundable', description: 'Once paid, the entry fee is non-refundable under any circumstances.' },
        { title: 'On-Time Check-In', description: 'Players must check in 15 minutes before match start. Late entries will not be allowed.' },
        { title: 'Valid ID Required', description: 'All players must use the same Game ID submitted during registration throughout the tournament.' },
        { title: 'No Team Switching', description: 'Once teams are finalized, no player substitutions or team changes are permitted.' },
        { title: 'Recording Mandatory', description: 'Every player must screen-record their gameplay. Failure to provide proof may void results.' },
        { title: 'Dispute Resolution', description: 'All disputes will be resolved by tournament admins. Their decision is final and binding.' },
        { title: 'Prize Distribution', description: 'Prizes will be credited within 48 hours after tournament completion to the registered UPI.' },
        { title: 'Communication Rules', description: 'Toxic behaviour, abuse, or harassment in chat or voice will lead to a permanent ban.' },
        { title: 'Device Responsibility', description: 'Players are responsible for their own internet and device issues. No rematches will be given.' }
    ]
};

let cachedSettings = null;

function withTimeout(promise, ms) {
    return new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('timeout')), ms);
        promise.then(
            v => { clearTimeout(t); resolve(v); },
            e => { clearTimeout(t); reject(e); }
        );
    });
}

async function fetchSettings() {
    if (!FIREBASE_CONFIGURED || !db) {
        cachedSettings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        return cachedSettings;
    }
    try {
        const snap = await withTimeout(db.collection('settings').doc('main').get(), 6000);
        if (snap.exists) {
            cachedSettings = Object.assign({}, DEFAULT_SETTINGS, snap.data());
        } else {
            cachedSettings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
            try {
                await withTimeout(db.collection('settings').doc('main').set(cachedSettings), 6000);
            } catch (e) { }
        }
    } catch (e) {
        cachedSettings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    }
    return cachedSettings;
}

function getSettings() {
    if (!cachedSettings) return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    return cachedSettings;
}

function fmtTime(ts) {
    if (!ts) return '';
    const d = (ts && ts.toDate) ? ts.toDate() : new Date(ts);
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
</script>

    <script>
        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        (async function init() {
            const list = document.getElementById('rulesList');
            const settings = await fetchSettings();
            if (!FIREBASE_CONFIGURED) {
                document.getElementById('setupWarning').style.display = 'block';
            }
            const rules = (settings && settings.rules) || [];
            rules.forEach((rule, i) => {
                const card = document.createElement('div');
                card.className = 'rule-card';
                card.style.animationDelay = Math.min(0.15 + i * 0.07, 0.78) + 's';
                card.innerHTML =
                    '<div class="rule-num">' + (i + 1) + '</div>' +
                    '<div class="rule-text">' +
                        '<h3>' + escapeHtml(rule.title) + '</h3>' +
                        '<p>' + escapeHtml(rule.description) + '</p>' +
                    '</div>' +
                    '<svg class="rule-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
                list.appendChild(card);
            });
        })();
    </script>

</body>
</html>
