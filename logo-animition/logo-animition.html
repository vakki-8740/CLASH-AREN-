<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QREN Esports Logo</title>
<style>
  :root { --bg: #ffffff; --fg: #0b0b0b; }
  
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    transition: background .4s;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; 
    font-family: Arial, sans-serif;
  }

  .logo { width: min(92vw, 560px); height: auto; cursor: pointer; overflow: visible; }
  .logo .fg { fill: var(--fg); fill-rule: evenodd; transition: fill .4s; }

  /* ---------- intro animation ---------- */
  .logo .anim {
    opacity: 0;
    animation: in .9s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: var(--d, 0s);
  }
  @keyframes in { to { opacity: 1; transform: none; } }

  .ring-top  { --d: .05s; transform: translate(0, -60px); }
  .ring-low  { --d: .20s; transform: translate(-60px, 40px); }
  .tail      { --d: .45s; transform: translate(-90px, -90px); }

  .letter  { opacity: 0; transform: translateY(40px);
             animation: in .7s cubic-bezier(.2,.8,.2,1) forwards;
             animation-delay: calc(.7s + var(--i) * .09s); }
  .sletter { opacity: 0; transform: translateX(-14px);
             animation: in .6s ease-out forwards;
             animation-delay: calc(1.15s + var(--i) * .07s); }

  /* hover: tail shoots forward a little */
  .tail-wrap { transition: transform .25s ease; }
  .logo:hover .tail-wrap { transform: translate(10px, 10px); }

</style>
</head>

<script>
  const logo = document.getElementById('logo');
  const parts = logo.querySelectorAll('.anim, .letter, .sletter');
  logo.addEventListener('click', () => {
    parts.forEach(el => el.style.animation = 'none');
    void logo.getBoundingClientRect();
    parts.forEach(el => el.style.animation = '');
  });
</script>
